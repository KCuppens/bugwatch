services:
  bugwatch-server-green:
    image: ghcr.io/kcuppens/bugwatch-server:${IMAGE_TAG:-latest}
    container_name: bugwatch-server-green
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - bugwatch
    environment:
      DATABASE_URL: postgres://bugwatch:${POSTGRES_PASSWORD:-bugwatch}@postgres:5432/bugwatch
      JWT_SECRET: ${JWT_SECRET}
      # Required in production: encrypts integration OAuth tokens at rest.
      BUGWATCH_ENCRYPTION_KEY: ${BUGWATCH_ENCRYPTION_KEY}
      # Dedicated secrets so a leaked JWT key can't also forge reset/oauth tokens.
      PASSWORD_RESET_SECRET: ${PASSWORD_RESET_SECRET}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      BUGWATCH_MODE: self-hosted
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SERVER_ADDR: 0.0.0.0:3000
      APP_URL: https://${DOMAIN:-localhost}
      ALLOWED_ORIGINS: https://${DOMAIN:-localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  bugwatch-web-green:
    image: ghcr.io/kcuppens/bugwatch-web:${IMAGE_TAG:-latest}
    container_name: bugwatch-web-green
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - bugwatch
    environment:
      PORT: 3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  bugwatch:
    external: true
