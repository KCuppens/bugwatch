[package]
name = "bugwatch"
version = "0.4.1"
edition = "2021"
authors = ["Bugwatch Team <support@bugwatch.dev>"]
description = "Official Rust SDK for Bugwatch - AI-Powered Error Tracking"
documentation = "https://bugwatch.dev/docs/sdks/rust"
homepage = "https://bugwatch.dev"
repository = "https://github.com/KCuppens/bugwatch"
license = "FSL-1.1-Apache-2.0"
readme = "README.md"
keywords = ["bugwatch", "error-tracking", "monitoring", "logging", "observability"]
categories = ["development-tools::debugging", "development-tools::profiling"]

[features]
default = ["async", "blocking"]
async = ["tokio", "reqwest"]
blocking = ["reqwest/blocking"]
full = ["async", "blocking", "actix", "axum"]

# Framework integrations
actix = ["dep:actix-web", "dep:actix-service", "dep:futures-util", "async"]
axum = ["dep:axum", "dep:tower", "dep:http", "dep:pin-project-lite", "async"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
once_cell = "1.19"
hostname = "0.4"
backtrace = "0.3"
lazy_static = "1.4"
parking_lot = "0.12"
thiserror = "1.0"
tracing = "0.1"

# Async support (optional)
tokio = { version = "1.0", features = ["rt-multi-thread", "sync"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

# Actix-web integration (optional)
actix-web = { version = "4", optional = true }
actix-service = { version = "2", optional = true }
futures-util = { version = "0.3", optional = true }

# Axum integration (optional)
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
http = { version = "1", optional = true }
pin-project-lite = { version = "0.2", optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
