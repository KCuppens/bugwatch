# buguno cell (BLUE) — bugwatch retrofit onto the infrauno shared-Caddy model.
# Mirror of /opt/buguno/docker-compose.blue.yml on the infrauno host.
# server + web + mcp on `edge` (reachable by the shared Caddy) + `internal`;
# postgres on `internal` only. Uses the existing ghcr bugwatch-* images
# (Phase-1: no republish). The mcp image is built ON the host as
# `bugwatch-mcp:local` (see README) until CI publishes ghcr.io/kcuppens/bugwatch-mcp.
name: buguno-blue

services:
  server:
    image: ghcr.io/kcuppens/bugwatch-server:${IMAGE_TAG:-latest}
    container_name: buguno-server-blue
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://buguno:${POSTGRES_PASSWORD}@buguno-db:5432/buguno
      BUGWATCH_MODE: self-hosted
      ENVIRONMENT: production
      SERVER_ADDR: 0.0.0.0:3000
      APP_URL: https://bugwatch.dev
      ALLOWED_ORIGINS: https://bugwatch.dev
    networks: [edge, internal]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    image: ghcr.io/kcuppens/bugwatch-web:${IMAGE_TAG:-latest}
    container_name: buguno-web-blue
    restart: unless-stopped
    environment:
      PORT: 3001
    networks: [edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  mcp:
    # Hosted MCP server (Streamable HTTP) at https://bugwatch.dev/mcp.
    image: bugwatch-mcp:local
    container_name: buguno-mcp-blue
    restart: unless-stopped
    env_file: [.env]
    environment:
      MCP_HTTP_PORT: 3002
      BUGWATCH_URL: http://buguno-server-blue:3000
    networks: [edge, internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16
    container_name: buguno-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: buguno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: buguno
    command: [postgres, -c, wal_level=replica, -c, archive_mode=on, -c, archive_command=/bin/true]
    volumes:
      - buguno_pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buguno"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  edge:
    external: true
  internal:
    name: buguno-internal

volumes:
  buguno_pgdata:
    name: buguno_pgdata
