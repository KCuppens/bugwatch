[package]
name = "bugwatch-server"
version = "0.1.0"
edition = "2021"
authors = ["Bugwatch Team"]
description = "Bugwatch API Server - AI-Powered Error Tracking"
license = "FSL-1.1-Apache-2.0"
repository = "https://github.com/KCuppens/bugwatch"

[features]
default = []
saas = ["dep:async-stripe", "dep:aws-sdk-sesv2", "dep:aws-config"]

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal", "io-util", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "timeout"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "any", "uuid", "chrono", "migrate"] }

# Authentication
jsonwebtoken = "9.3"
bcrypt = "0.16"
sha2 = "0.10"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
regex = "1.11"
url = "2.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
dotenvy = "0.15"

# Async utilities
async-trait = "0.1"
futures-util = "0.3"

# Cryptography
hex = "0.4"
hmac = "0.12"
aes-gcm = "0.10"
rand = "0.8"
subtle = "2"

# Rate limiting
dashmap = "6"

# Encoding
base64 = "0.22"
urlencoding = "2.1"

# HTTP client for external APIs
reqwest = { version = "0.12", features = ["json"] }

# Stripe payments (SaaS only)
async-stripe = { version = "0.41", features = ["runtime-tokio-hyper"], optional = true }

# AWS SDK for email (SES) (SaaS only)
aws-config = { version = "1.5", features = ["behavior-version-latest"], optional = true }
aws-sdk-sesv2 = { version = "1.54", optional = true }

# SMTP for self-hosted email
lettre = { version = "0.11", features = ["tokio1-native-tls"] }

# BugWatch SDK for self-monitoring (dogfooding)
bugwatch = { version = "0.2", features = ["async"] }

[dev-dependencies]
tokio-test = "0.4"

[profile.dev]
# Reduce debug info to avoid MSVC LNK1318 PDB file limit on Windows.
# Line-table info is enough for stack traces; full DWARF is not needed in dev.
debug = 1

[profile.release]
# Full link-time optimization; slower builds, ~20-30% smaller binary and
# noticeable runtime wins on hot paths. codegen-units = 1 further improves
# inlining at the cost of parallel backend work.
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
