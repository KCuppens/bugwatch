services:
  postgres:
    image: postgres:16-alpine
    container_name: bugwatch-postgres
    restart: always
    networks:
      bugwatch:
        aliases:
          - postgres
    environment:
      POSTGRES_USER: bugwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bugwatch}
      POSTGRES_DB: bugwatch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugwatch"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    container_name: bugwatch-caddy
    restart: always
    networks:
      - bugwatch
    # Caddy resolves {$DOMAIN} in the Caddyfile from its own environment at
    # runtime (compose substitution does not reach into the mounted Caddyfile),
    # so DOMAIN must be passed through here for automatic HTTPS to work.
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: bugwatch-autoheal
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 60
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  bugwatch:
    name: bugwatch
    driver: bridge
