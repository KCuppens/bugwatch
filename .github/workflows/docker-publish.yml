name: Build and Publish Docker Images

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: ghcr.io/kcuppens/bugwatch-server
            dockerfile: apps/server/Dockerfile
            cache_scope: server
            build_args: ""
          # apps/web/Dockerfile — pnpm monorepo build, published to GHCR for
          # managed/cloud deployments. For self-hosted installs, docker/Dockerfile.web
          # is the standalone npm build (validated by ci.yml docker-build job).
          # NEXT_PUBLIC_API_URL is inlined at build time; single-origin deploy
          # (Caddy routes /api/* to the server) → point at https://bugwatch.dev.
          - image: ghcr.io/kcuppens/bugwatch-web
            dockerfile: apps/web/Dockerfile
            cache_scope: web
            build_args: |
              NEXT_PUBLIC_API_URL=https://bugwatch.dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  validate-self-hosted-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate self-hosted web Dockerfile builds
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          tags: bugwatch-web-selfhosted:ci
