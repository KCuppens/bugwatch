name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "Image tag to deploy (e.g. sha-abc1234). Defaults to latest."
        required: false
        type: string
        default: "latest"

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'pipeline' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/kcuppens/bugwatch-server
  WEB_IMAGE: ghcr.io/kcuppens/bugwatch-web

jobs:
  # ---------- CI (skipped on manual dispatch) ----------
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  # ---------- Build + push images (skipped on manual dispatch) ----------
  build-and-push:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ steps.tag.outputs.sha_tag }}
            ${{ env.SERVER_IMAGE }}:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.sha_tag }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # ---------- Deploy to staging ----------
  deploy-staging:
    # always() overrides the default "skip if dependency skipped" behavior.
    # !failure() ensures we don't deploy if CI or build actually failed.
    # !cancelled() ensures we don't deploy if the workflow was cancelled.
    if: >-
      always() && !failure() && !cancelled() &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'))
    needs: [ci, build-and-push]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: IMAGE_TAG,GHCR_TOKEN,GHCR_USER,DEPLOY_ENV
          script: |
            cd /opt/bugwatch
            bash scripts/deploy-blue-green.sh
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag || inputs.image_tag || 'latest' }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_ENV: staging

  # ---------- Deploy to production ----------
  deploy-production:
    if: >-
      always() && !failure() && !cancelled() &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production'))
    # On push: waits for staging to succeed. On manual dispatch to production: staging is skipped, runs directly.
    needs: [ci, build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: IMAGE_TAG,GHCR_TOKEN,GHCR_USER,DEPLOY_ENV
          script: |
            cd /opt/bugwatch
            bash scripts/deploy-blue-green.sh
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag || inputs.image_tag || 'latest' }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_ENV: production
