name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Rust backend checks
  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/server/target
          # Scope the cache to this workspace so unrelated SDK Cargo.lock
          # changes don't evict the server's target directory.
          key: ${{ runner.os }}-cargo-server-${{ hashFiles('apps/server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-server-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

  # TypeScript/Next.js checks
  web-check:
    name: Web Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run unit tests with coverage
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 30

  # E2E tests with Playwright
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [web-check]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Python SDK checks
  python-sdk-check:
    name: Python SDK Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk/python
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy bugwatch/

      - name: Run tests
        run: pytest --cov=bugwatch --cov-report=term-missing

  # Rust SDK checks
  rust-sdk-check:
    name: Rust SDK Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk/rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/sdk/rust/target
          key: ${{ runner.os }}-cargo-sdk-${{ hashFiles('packages/sdk/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sdk-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

  # Go SDK checks
  go-sdk-check:
    name: Go SDK Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk/go
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: packages/sdk/go

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

  # Ruby SDK checks
  ruby-sdk-check:
    name: Ruby SDK Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk/ruby
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: packages/sdk/ruby

      - name: Lint
        run: bundle exec rubocop

      - name: Run tests
        run: bundle exec rspec

  # PHP SDK checks
  php-sdk-check:
    name: PHP SDK Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk/php
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer, phpstan, php-cs-fixer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Code style check
        run: php-cs-fixer fix --dry-run --diff

      - name: Static analysis
        run: phpstan analyse

      - name: Run tests
        run: vendor/bin/phpunit

  # Java SDK checks
  java-sdk-check:
    name: Java SDK Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk/java
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: mvn verify -B

  # Build Docker images (only on main)
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [rust-check, web-check, e2e-test, python-sdk-check, rust-sdk-check, go-sdk-check, ruby-sdk-check, php-sdk-check, java-sdk-check]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          push: false
          tags: bugwatch-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          tags: bugwatch-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
